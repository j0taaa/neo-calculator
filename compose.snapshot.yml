# One public application and its private daily synchronization worker.
# Reuse the existing catalog volume; its historical Docker name is intentional.
services:
  calculator:
    environment:
      HUAWEI_SNAPSHOT_DIR: /app/snapshots
      HUAWEI_SOURCE_ACCESS: offline
    volumes:
      - neo_calculator_snapshots:/app/snapshots:ro
    labels:
      - traefik.http.routers.calculator-preview-redirect.rule=Host(`calculator-offline.hwctools.site`) || Host(`calculator-lab.hwctools.site`)
      - traefik.http.routers.calculator-preview-redirect.entrypoints=websecure
      - traefik.http.routers.calculator-preview-redirect.tls.certresolver=le
      - traefik.http.routers.calculator-preview-redirect.priority=100
      - traefik.http.routers.calculator-preview-redirect.service=noop@internal
      - traefik.http.routers.calculator-preview-redirect.middlewares=calculator-preview-canonical
      - traefik.http.middlewares.calculator-preview-canonical.redirectregex.regex=^https?://calculator-(offline|lab)[.]hwctools[.]site/(.*)
      - traefik.http.middlewares.calculator-preview-canonical.redirectregex.replacement=https://calculator.hwctools.site/$${2}
      - traefik.http.middlewares.calculator-preview-canonical.redirectregex.permanent=true
  calculator-sync:
    build:
      context: ${NEO_CALCULATOR_DIR:-/home/neo-calculator}
      dockerfile: Dockerfile.sync
    environment:
      HWC_SOCKS5_PROXY: socks5h://host.docker.internal:40001
      HUAWEI_SYNC_CONCURRENCY: '1'
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - neo_calculator_snapshots:/app/snapshots
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    mem_limit: 2g
    pids_limit: 256
    restart: unless-stopped
    networks:
      - web
    image: neo-calculator-sync:daily
    stop_grace_period: 30s
    labels:
      - traefik.enable=false
volumes:
  neo_calculator_snapshots:
    external: true
    name: ${NEO_CALCULATOR_SNAPSHOT_VOLUME:-neo-offline_snapshots}
