services:
  # A stopped container reference protects the worker image from the host's
  # periodic unused-image prune. It runs no calculator and consumes no CPU.
  runtime-image:
    image: neo-browserless-runtime:demo
    entrypoint: ["/bin/true"]
    network_mode: none
    read_only: true
    restart: "no"
  proxy:
    image: nginx:alpine
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=home_web
      - traefik.http.routers.neo-browserless-demo.rule=Host(`calculator-lab.hwctools.site`) && PathPrefix(`/browserless-demo`)
      - traefik.http.routers.neo-browserless-demo.priority=1000
      - traefik.http.routers.neo-browserless-demo.entrypoints=websecure
      - traefik.http.routers.neo-browserless-demo.tls.certresolver=le
      - traefik.http.services.neo-browserless-demo.loadbalancer.server.port=80
    restart: unless-stopped
    networks:
      - web
networks:
  web:
    external: true
    name: home_web
